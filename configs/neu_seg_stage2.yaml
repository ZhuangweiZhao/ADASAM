# NEU_Seg Stage 2: prototype-conditioned semantic queries.

backbone:
  model_type: vit_t
  checkpoint: weights/mobile_sam.pt

data:
  data_root: data/NEU_Seg
  num_classes: 4

fewshot:
  support_shot: 5
  negative_episode_prob: 0.4
  copy_paste_prob: 0.5
  class_sampling_weights: [0.45, 0.25, 0.30]

semantic_query:
  embed_dim: 256
  num_queries: 16
  num_layers: 3
  num_heads: 8
  ffn_dim: 1024
  dropout: 0.0

semantic_query_loss:
  bce_weight: 1.0
  dice_weight: 1.0
  diversity_weight: 0.05
  auxiliary_weight: 0.5
  boundary_weight: 0.2
  consistency_weight: 0.1
  tversky_weight: 1.0
  tversky_alpha: 0.3
  tversky_beta: 0.7
  tversky_gamma: 1.33
  class_loss_weights: [1.5, 1.0, 1.15]

train:
  epochs: 100
  episodes_per_epoch: 100
  lr: 1.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0
  adapter_lr: 1.0e-5
  backbone_lr: 5.0e-6
  unfreeze_after: 70
  val_every: 1             # evaluate every epoch for best-checkpoint selection
  support_val_fraction: 0.2
  val_samples: 0           # validation is the held-out K-shot support pool
  device: cuda

eval:
  foreground_threshold: 0.5

seed: 42
output_dir: runs
